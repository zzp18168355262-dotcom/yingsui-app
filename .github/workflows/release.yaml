name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match the tag to pubspec.yaml
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(sed -nE 's/^version: ([^+]+).*/\1/p' pubspec.yaml)"
          test -n "$package_version"
          test "$tag_version" = "$package_version"

  android:
    name: Build Android APK
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --flavor prod -t lib/main_prod.dart
      - name: Package APK
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release-assets
          cp build/app/outputs/flutter-apk/app-prod-release.apk "release-assets/shadowing-english-${TAG}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release-assets/*

  linux:
    name: Build Linux bundle
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          cache: true
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libmpv-dev ninja-build
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package Linux bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release-assets
          tar -C build/linux/x64/release -czf "release-assets/shadowing-english-${TAG}-linux-x64.tar.gz" bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release-assets/*

  macos:
    name: Build macOS app
    needs: verify-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package macOS app
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release-assets dmg-root
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          cp -R "$app_path" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Shadowing English" -srcfolder dmg-root -ov -format UDZO \
            "${GITHUB_WORKSPACE}/release-assets/shadowing-english-${TAG}-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release-assets/*

  windows:
    name: Build Windows bundle
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows bundle
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force release-assets
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "release-assets/shadowing-english-$env:TAG-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release-assets/*

  publish:
    name: Publish GitHub Release
    needs: [android, linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Create release with generated update notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
