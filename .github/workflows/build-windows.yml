name: Build Windows (manual)

# 只构建 Windows x64，手动触发。
#
# 为什么不直接复用 release.yaml：
#   那个 workflow 只在推 v* tag 时运行，而且它的 publish job 依赖
#   android / linux / macos / windows 四个 job **全部成功**。
#   当目标只是"拿一个 Windows 包"时，被其它平台拖累的代价太大
#   （Linux 要 libmpv、macOS 要额外签名步骤，任一环节挂了就白等）。
#   这里只做一件事：产出一个可以直接分发的 windows-x64.zip。
#
# 用法：
#   仓库页面 → Actions → Build Windows (manual) → Run workflow
#   跑完在该次运行的 Artifacts 区域下载 windows-x64

on:
  # 手动触发：仓库页面 → Actions → Build Windows (manual) → Run workflow
  workflow_dispatch:
  # 推到 main 也自动构建一次，省得每次都要去点按钮。
  # 这里只编 Windows，不会牵动 Android / iOS / Linux / macOS。
  push:
    branches: [main]

permissions:
  # 需要 write 才能在最后把文件挂到 GitHub Release 上。
  # 这是"公开、不用登录就能下载"的唯一途径：
  # Actions 的 artifact 下载一律要求登录 GitHub。
  contents: write

jobs:
  windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      # ---- 内置 ffmpeg：AI 字幕必需，flutter build 不会自动打包 ----
      - name: Cache subtitle FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-bundle/windows-x64
          key: ffmpeg-8.1.2-windows-x64-${{ hashFiles('tool/ffmpeg/build_ffmpeg.sh') }}

      - uses: msys2/setup-msys2@v2
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          install: make diffutils nasm mingw-w64-x86_64-gcc
          msystem: MINGW64

      - name: Build subtitle FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash tool/ffmpeg/build_ffmpeg.sh windows-x64 build/ffmpeg-bundle/windows-x64

      # 冒烟测试：确认编出来的 ffmpeg 真能做「抽音频 + 切段 + 读回字幕」，
      # 而不是等到用户在应用里点 AI 字幕才发现是坏的。
      - name: Smoke test subtitle FFmpeg
        shell: pwsh
        run: |
          $ffmpeg = "build/ffmpeg-bundle/windows-x64/ffmpeg.exe"
          $smoke = "build/ffmpeg-smoke"
          New-Item -ItemType Directory -Force $smoke | Out-Null
          & $ffmpeg -y -f lavfi -i "sine=frequency=1000:duration=2" -c:a pcm_s16le "$smoke/input.wav"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $ffmpeg -y -i "$smoke/input.wav" -vn -ac 1 -ar 16000 -b:a 24k -f segment -segment_time 1 -reset_timestamps 1 "$smoke/chunk_%05d.m4a"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$smoke/chunk_00000.m4a")) { exit 1 }
          & $ffmpeg -y -i "$smoke/input.wav" -i tool/ffmpeg/smoke.srt -c:a aac -c:s mov_text -f ipod "$smoke/embedded.mp4"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $subtitle = & $ffmpeg -v error -i "$smoke/embedded.mp4" -map 0:s:0 -f srt -
          if ($LASTEXITCODE -ne 0 -or ($subtitle -join "`n") -notmatch "Hello from the subtitle smoke test") { exit 1 }

      - run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      # 应用按 <exe 所在目录>\ffmpeg\ffmpeg.exe 查找内置音频组件
      # （见 lib/features/player/presentation/desktop_ffmpeg.dart）。
      - name: Bundle subtitle FFmpeg
        shell: pwsh
        run: |
          Copy-Item build/ffmpeg-bundle/windows-x64 build/windows/x64/runner/Release/ffmpeg -Recurse
          $bundled = "build/windows/x64/runner/Release/ffmpeg/ffmpeg.exe"
          if (-not (Test-Path $bundled)) { exit 1 }
          & $bundled -version | Select-Object -First 1

      - name: Package portable zip
        shell: pwsh
        run: |
          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -match '(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)') {
            $version = $Matches[1]
          } else {
            throw "在 pubspec.yaml 里读不到版本号"
          }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          # 必须整包压缩：exe 依赖同目录的 DLL、data\ 和 ffmpeg\
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "release-assets/EnglishCorner-$version-windows-x64.zip"
          Get-ChildItem release-assets | Format-Table Name, Length

      # 先把"绿色版"交上去：后面编安装包万一失败，这个产物仍然能下载
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-portable
          path: release-assets/EnglishCorner-*-windows-x64.zip
          if-no-files-found: error

      # ---- 安装包（Inno Setup）----
      # 目标产物：EnglishCorner-<版本>-windows-x64-setup.exe
      # 双击即可安装，带开始菜单/桌面快捷方式与卸载程序。
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $found = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            if ($found) { $iscc = $found.FullName }
          }
          if (-not (Test-Path $iscc)) { throw "装完 Inno Setup 仍找不到 ISCC.exe" }
          Write-Host "ISCC：$iscc"

          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -match '(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)') {
            $version = $Matches[1]
          } else {
            throw "在 pubspec.yaml 里读不到版本号"
          }

          $releaseDir = (Resolve-Path "build/windows/x64/runner/Release").Path
          $outDir = (Resolve-Path "release-assets").Path

          $isccArgs = @(
            "/DMyAppVersion=$version",
            "/DSourceDir=$releaseDir",
            "/O$outDir"
          )

          # 只有自带简体中文语言包时才启用中文安装界面：语言包必须与
          # Inno Setup 版本严格对应，塞错版本会直接编译失败。
          $cn = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages\ChineseSimplified.isl"
          if (Test-Path $cn) {
            $isccArgs += "/DUseChinese=1"
            Write-Host "自带简体中文语言包 → 安装界面用中文"
          } else {
            Write-Host "未找到自带简体中文语言包 → 安装界面退回英文"
          }

          $isccArgs += "installer\windows.iss"

          # 输出同时落盘：万一编译失败，这个日志会作为 artifact 上传，
          # 方便把具体报错拿出来看（仓库所有者才看得到 CI 日志）。
          & $iscc @isccArgs 2>&1 | Tee-Object -FilePath installer-build.log
          # 先把退出码取出来再判断：$LASTEXITCODE 会被后续命令覆盖
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }

          Get-ChildItem release-assets | Format-Table Name, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: release-assets/EnglishCorner-*-windows-x64-setup.exe
          if-no-files-found: error

      # 安装包编译失败时，把 ISCC 的输出捞出来，便于定位
      - name: Upload installer build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-build-log
          path: installer-build.log
          if-no-files-found: ignore

      # ---- 挂到 Release，拿到"不用登录也能下载"的公开直链 ----
      #
      # 为什么要这一步：Actions 的 artifact 下载**强制要求登录 GitHub**，
      # 没法直接发给别人。Release 的附件是公开的，可以直接分享。
      #
      # 标签用 windows-v<版本> 而不是 v<版本>：
      # 后者会触发 release.yaml（五个平台全量构建 + 自己的 publish），
      # 两边抢同一个 Release 会打架。
      #
      # continue-on-error：仓库若把 Workflow permissions 限制成只读，
      # 这一步会失败，但**不影响上面的 artifact**，所以不让它把整个构建变红。
      - name: Publish release (public download links)
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -match '(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)') {
            $version = $Matches[1]
          } else {
            throw "在 pubspec.yaml 里读不到版本号"
          }
          $tag = "windows-v$version"

          $assets = @(
            "release-assets/EnglishCorner-$version-windows-x64-setup.exe",
            "release-assets/EnglishCorner-$version-windows-x64.zip"
          )
          foreach ($a in $assets) {
            if (-not (Test-Path $a)) { throw "缺少附件：$a" }
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在，更新附件"
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag `
              --title "英语角 English Corner $version (Windows)" `
              --notes-file installer/release-notes-windows.md `
              --target main `
              @assets
          }
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "发布 Release 失败（退出码 $code）" }
          Write-Host "公开下载页：https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
